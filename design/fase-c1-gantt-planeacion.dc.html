<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Montserrat', -apple-system, sans-serif; background:#F7F8FA; }
  a { color: #FF7500; text-decoration:none; }
  a:hover { color: #E56700; }
</style>
</helmet>

<div style="min-height:100vh; color:#1B3B51;">

  <div style="background:#fff; border-bottom:1px solid #E1E5EA; padding:0 32px; display:flex; align-items:center; gap:28px; height:60px;">
    <div style="font-weight:700; font-size:15px;">Dashboard 414</div>
    <nav style="display:flex; gap:4px; flex:1;">
      <a href="Home - Resumen General.dc.html" style="padding:8px 14px; border-radius:8px; color:#627887; font-size:13px; font-weight:600;">Resumen</a>
      <span style="padding:8px 14px; border-radius:8px; background:#FFF3E8; color:#CC5E00; font-size:13px; font-weight:600;">Planeación</span>
    </nav>
    <span style="font-size:13px; color:#627887;">Ana Torres</span>
    <span style="font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px; background:#FFF3E8; color:#8A4300;">Admin</span>
  </div>

  <main style="max-width:1360px; margin:0 auto; padding:28px 32px 64px; display:flex; flex-direction:column; gap:20px;">

    <header>
      <h1 style="font-size:24px; font-weight:700; margin:0 0 4px;">Planeación — Diagrama de Gantt</h1>
      <p style="font-size:13px; color:#627887; margin:0;">{{ rangoLabel }}</p>
    </header>

    <section style="display:flex; flex-wrap:wrap; align-items:center; gap:16px;">
      <div style="display:flex; border:1px solid #E1E5EA; border-radius:10px; overflow:hidden;">
        <button onClick="{{ setZoomMes }}" style="height:36px; padding:0 16px; border:none; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; background:{{ zoomMesBg }}; color:{{ zoomMesColor }};">Mensual</button>
        <button onClick="{{ setZoomSemana }}" style="height:36px; padding:0 16px; border:none; border-left:1px solid #E1E5EA; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; background:{{ zoomSemanaBg }}; color:{{ zoomSemanaColor }};">Semanal</button>
      </div>
      <div style="display:flex; border:1px solid #E1E5EA; border-radius:10px; overflow:hidden;">
        <button onClick="{{ setFiltroTodos }}" style="height:36px; padding:0 14px; border:none; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; background:{{ filtroTodosBg }}; color:{{ filtroTodosColor }};">Todos</button>
        <button onClick="{{ setFiltroCon }}" style="height:36px; padding:0 14px; border:none; border-left:1px solid #E1E5EA; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; background:{{ filtroConBg }}; color:{{ filtroConColor }};">Con consumo</button>
        <button onClick="{{ setFiltroSin }}" style="height:36px; padding:0 14px; border:none; border-left:1px solid #E1E5EA; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; background:{{ filtroSinBg }}; color:{{ filtroSinColor }};">Sin consumo</button>
      </div>
      <div style="display:flex; align-items:center; gap:14px; margin-left:auto; font-size:12px; color:#627887;">
        <span style="display:flex; align-items:center; gap:6px;"><span style="width:10px; height:10px; border-radius:3px; background:#D8DEE4;"></span>Pendiente</span>
        <span style="display:flex; align-items:center; gap:6px;"><span style="width:10px; height:10px; border-radius:3px; background:oklch(0.58 0.16 250);"></span>En proceso</span>
        <span style="display:flex; align-items:center; gap:6px;"><span style="width:10px; height:10px; border-radius:3px; background:oklch(0.62 0.15 150);"></span>Completada</span>
        <span style="display:flex; align-items:center; gap:6px;"><span style="width:10px; height:10px; border-radius:3px; background:oklch(0.55 0.2 25);"></span>Atrasada</span>
        <span style="display:flex; align-items:center; gap:6px;"><span style="width:8px; height:8px; background:#FF7500; transform:rotate(45deg);"></span>Hito</span>
      </div>
    </section>

    <section style="background:#fff; border:1px solid #E1E5EA; border-radius:14px; box-shadow:0 1px 3px rgba(27,59,81,0.06); overflow:hidden; position:relative;">
      <div style="display:flex;">
        <div style="width:260px; flex-shrink:0; border-right:1px solid #E1E5EA;">
          <div style="height:40px; display:flex; align-items:center; padding:0 14px; font-size:11px; font-weight:700; color:#627887; text-transform:uppercase; letter-spacing:0.04em; border-bottom:1px solid #E1E5EA;">Requerimiento / tarea</div>
          <sc-for list="{{ filas }}" as="f" hint-placeholder-count="10">
            <div style="height:36px; display:flex; align-items:center; padding:0 14px 0 {{ f.indent }}px; font-size:{{ f.fontSize }}; font-weight:{{ f.fontWeight }}; color:{{ f.color }}; border-bottom:1px solid #F1F2F5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ f.label }}</div>
          </sc-for>
        </div>
        <div style="flex:1; overflow-x:auto;">
          <div style="min-width:{{ gridMinWidth }}px;">
            <div style="height:40px; display:grid; grid-template-columns:{{ colTemplate }}; border-bottom:1px solid #E1E5EA;">
              <sc-for list="{{ columnas }}" as="c" hint-placeholder-count="10">
                <div style="display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; color:{{ c.hoy }}; border-left:1px solid #F1F2F5;">{{ c.label }}</div>
              </sc-for>
            </div>
            <sc-for list="{{ filas }}" as="f" hint-placeholder-count="10">
              <div style="height:36px; display:grid; grid-template-columns:{{ colTemplate }}; border-bottom:1px solid #F1F2F5; position:relative;">
                <sc-if value="{{ f.esTarea }}" hint-placeholder-val="{{ false }}">
                  <a href="Detalle Requerimiento.dc.html" onMouseEnter="{{ f.onHover }}" onMouseLeave="{{ onLeave }}" style="grid-column:{{ f.col }}; align-self:center; height:20px; border-radius:5px; background:{{ f.barColor }}; margin:0 2px; display:block; cursor:pointer;"></a>
                </sc-if>
                <sc-if value="{{ f.esHito }}" hint-placeholder-val="{{ false }}">
                  <span onMouseEnter="{{ f.onHoverHito }}" onMouseLeave="{{ onLeave }}" style="grid-column:{{ f.hitoCol }}; align-self:center; justify-self:center; width:10px; height:10px; background:#FF7500; transform:rotate(45deg); cursor:pointer;"></span>
                </sc-if>
              </div>
            </sc-for>
          </div>
        </div>
      </div>

      <sc-if value="{{ tooltip }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute; left:{{ tooltip.x }}px; top:{{ tooltip.y }}px; background:#1B3B51; color:#fff; padding:10px 12px; border-radius:8px; font-size:12px; line-height:1.5; box-shadow:0 4px 12px rgba(27,59,81,0.25); z-index:10; pointer-events:none; min-width:180px;">
          <div style="font-weight:700; margin-bottom:2px;">{{ tooltip.tarea }}</div>
          <div>{{ tooltip.fechas }}</div>
          <div>Asignado: {{ tooltip.asignado }}</div>
          <div>Avance: {{ tooltip.avance }}</div>
        </div>
      </sc-if>
    </section>

  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const DIA_MS = 86400000;
function parseLocal(str) {
  const [y, m, d] = str.split("-").map(Number);
  return new Date(y, m - 1, d);
}
const MES_INICIO = new Date(2026, 7, 1);
const MES_FIN = new Date(2026, 7, 31);
const SEM_INICIO = new Date(2026, 7, 3);
const SEM_FIN = new Date(2026, 7, 9);
const HOY = new Date(2026, 7, 9);

const COLOR_ESTADO = {
  pendiente: "#D8DEE4",
  proceso: "oklch(0.58 0.16 250)",
  completada: "oklch(0.62 0.15 150)",
  atrasada: "oklch(0.55 0.2 25)",
};

const DATA = [
  { req: "REQ-101", nombre: "Portal de pagos en línea PSE", consumo: true, tareas: [
    { tarea: "Análisis de requerimientos PCI", estado: "completada", start: "2026-08-01", end: "2026-08-04", asignado: "L. Ramírez", avance: "100%" },
    { tarea: "Integración pasarela PSE", estado: "proceso", start: "2026-08-05", end: "2026-08-14", asignado: "J. Gómez", avance: "62%", hito: "Certificación PCI" },
    { tarea: "QA y pruebas de carga", estado: "pendiente", start: "2026-08-15", end: "2026-08-22", asignado: "C. Duarte", avance: "0%" },
  ]},
  { req: "REQ-102", nombre: "Rediseño flujo de afiliación", consumo: true, tareas: [
    { tarea: "Wireframes y flujo UX", estado: "completada", start: "2026-08-01", end: "2026-08-06", asignado: "M. Salas", avance: "100%" },
    { tarea: "Desarrollo frontend", estado: "proceso", start: "2026-08-07", end: "2026-08-18", asignado: "P. León", avance: "55%", hito: "Entrega beta" },
    { tarea: "Validación con stakeholders", estado: "pendiente", start: "2026-08-19", end: "2026-08-24", asignado: "M. Salas", avance: "0%" },
  ]},
  { req: "REQ-104", nombre: "Integración pasarela Wompi", consumo: true, tareas: [
    { tarea: "Diseño técnico de integración", estado: "atrasada", start: "2026-08-01", end: "2026-08-08", asignado: "J. Gómez", avance: "40%" },
    { tarea: "Desarrollo API Wompi", estado: "pendiente", start: "2026-08-09", end: "2026-08-20", asignado: "J. Gómez", avance: "0%" },
  ]},
  { req: "REQ-105", nombre: "Panel de reportes financieros", consumo: false, tareas: [
    { tarea: "Levantamiento de requisitos", estado: "pendiente", start: "2026-08-12", end: "2026-08-19", asignado: "L. Ramírez", avance: "0%" },
    { tarea: "Definición de KPIs a mostrar", estado: "pendiente", start: "2026-08-20", end: "2026-08-26", asignado: "L. Ramírez", avance: "0%" },
  ]},
  { req: "REQ-109", nombre: "Firma electrónica de contratos", consumo: true, tareas: [
    { tarea: "Pruebas de integración legal", estado: "proceso", start: "2026-08-04", end: "2026-08-11", asignado: "C. Duarte", avance: "88%", hito: "Corte de sprint QA" },
  ]},
];

function dias(a, b) { return Math.round((b.getTime() - a.getTime()) / DIA_MS); }
function fmt(d) { return parseLocal(d).toLocaleDateString("es-CO", { day: "2-digit", month: "short" }); }

class Component extends DCLogic {
  state = { zoom: "mes", filtro: "todos", tooltip: null };

  buildColumns(inicio, fin) {
    const total = dias(inicio, fin) + 1;
    const cols = [];
    for (let i = 0; i < total; i++) {
      const d = new Date(inicio.getTime() + i * DIA_MS);
      cols.push({ label: this.state.zoom === "semana" ? d.toLocaleDateString("es-CO", { weekday: "short" }) : String(d.getDate()), hoy: dias(HOY, d) === 0 ? "#FF7500" : "#627887" });
    }
    return { cols, total };
  }

  renderVals() {
    const inicio = this.state.zoom === "semana" ? SEM_INICIO : MES_INICIO;
    const fin = this.state.zoom === "semana" ? SEM_FIN : MES_FIN;
    const { cols, total } = this.buildColumns(inicio, fin);
    const colWidth = this.state.zoom === "semana" ? 100 : 28;

    const reqsFiltrados = DATA.filter((r) => {
      if (this.state.filtro === "con") return r.consumo;
      if (this.state.filtro === "sin") return !r.consumo;
      return true;
    });

    const filas = [];
    reqsFiltrados.forEach((r) => {
      filas.push({ esGrupo: true, esTarea: false, esHito: false, label: `${r.req} · ${r.nombre}`, indent: 14, fontSize: "12.5px", fontWeight: 700, color: "#1B3B51" });
      r.tareas.forEach((t) => {
        const startD = parseLocal(t.start), endD = parseLocal(t.end);
        const colStart = Math.max(dias(inicio, startD), 0) + 1;
        const colEnd = Math.min(dias(inicio, endD), total - 1) + 2;
        const visible = colEnd > 1 && colStart <= total;
        const fila = {
          esGrupo: false, esTarea: visible, esHito: false,
          label: t.tarea, indent: 30, fontSize: "12.5px", fontWeight: 400, color: "#627887",
          col: `${Math.max(colStart,1)} / ${Math.max(colEnd, colStart+1)}`,
          barColor: COLOR_ESTADO[t.estado],
          onHover: (e) => this.setState({ tooltip: { x: e.clientX - e.currentTarget.closest('section').getBoundingClientRect().left + 10, y: e.clientY - e.currentTarget.closest('section').getBoundingClientRect().top - 60, tarea: t.tarea, fechas: `${fmt(t.start)} – ${fmt(t.end)}`, asignado: t.asignado, avance: t.avance } }),
        };
        if (t.hito) {
          const hitoD = parseLocal(t.end);
          const hitoCol = Math.max(dias(inicio, hitoD), 0) + 1;
          fila.esHito = hitoCol >= 1 && hitoCol <= total;
          fila.hitoCol = `${hitoCol} / ${hitoCol + 1}`;
          fila.onHoverHito = (e) => this.setState({ tooltip: { x: e.clientX - e.currentTarget.closest('section').getBoundingClientRect().left + 10, y: e.clientY - e.currentTarget.closest('section').getBoundingClientRect().top - 60, tarea: `Hito: ${t.hito}`, fechas: fmt(t.end), asignado: t.asignado, avance: t.avance } });
        }
        filas.push(fila);
      });
    });

    const btn = (active) => ({ bg: active ? "#FFF3E8" : "#fff", color: active ? "#CC5E00" : "#627887" });
    const zm = btn(this.state.zoom === "mes"), zs = btn(this.state.zoom === "semana");
    const ft = btn(this.state.filtro === "todos"), fc = btn(this.state.filtro === "con"), fs = btn(this.state.filtro === "sin");

    return {
      rangoLabel: this.state.zoom === "semana" ? "Semana del 3 al 9 de agosto, 2026" : "Agosto 2026 — mes actual",
      columnas: cols,
      colTemplate: `repeat(${total}, ${colWidth}px)`,
      gridMinWidth: total * colWidth,
      filas,
      tooltip: this.state.tooltip,
      onLeave: () => this.setState({ tooltip: null }),
      setZoomMes: () => this.setState({ zoom: "mes" }),
      setZoomSemana: () => this.setState({ zoom: "semana" }),
      setFiltroTodos: () => this.setState({ filtro: "todos" }),
      setFiltroCon: () => this.setState({ filtro: "con" }),
      setFiltroSin: () => this.setState({ filtro: "sin" }),
      zoomMesBg: zm.bg, zoomMesColor: zm.color, zoomSemanaBg: zs.bg, zoomSemanaColor: zs.color,
      filtroTodosBg: ft.bg, filtroTodosColor: ft.color, filtroConBg: fc.bg, filtroConColor: fc.color, filtroSinBg: fs.bg, filtroSinColor: fs.color,
    };
  }
}

</script>
</body>
</html>
